name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with tauri.conf.json ships a binary whose in-app
      # version does not match its download name. Catch it before building.
      - name: Tag must match tauri.conf.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $CONF"
            exit 1
          fi
          echo "Version $CONF verified."

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build
        working-directory: apps/desktop
        # tauri:build runs the sidecar script first, which is bash. Windows
        # runners have Git Bash on PATH, so this works there too.
        shell: bash
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Source stays private, binaries go public. A release on a private repo
      # is only visible to collaborators, so the artifacts are published to
      # the separate public releases repo instead.
      #
      # GITHUB_TOKEN cannot write to another repository. Create a fine-grained
      # PAT scoped to NeuroTendrils/releases with Contents: read and write,
      # then save it as the RELEASES_TOKEN secret on this repo.
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: NeuroTendrils/releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: suite-${{ github.ref_name }}
          name: NeuroTendrils Suite ${{ github.ref_name }}
          files: dist/**/*
          prerelease: true
          body: |
            NeuroTendrils Suite ${{ github.ref_name }}

            Pre-release. Download the file for your platform below.
