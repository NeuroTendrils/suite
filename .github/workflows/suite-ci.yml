name: Suite CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  license-boundary:
    # suite/ is proprietary; neuroflow/ is AGPL-3.0. One careless import across
    # that line relicenses the product. Catch it here, not in a lawyer's email.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No AGPL code inside the proprietary backend
        run: |
          if grep -rl "AGPL" backend/src/; then
            echo "::error::AGPL-licensed code found under backend/src — this would relicense the Suite."
            exit 1
          fi
          echo "License boundary intact."

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Labs run Windows. Build it on every push so it cannot silently rot.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run tauri:build
