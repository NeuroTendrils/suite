[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotendrils-suite"
version = "0.1.0"
description = "NeuroTendrils desktop suite (GUI + workers)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "h5py>=3.10",
    "pymatreader>=1.0",
    "mne>=1.6",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.scripts]
neurotendrils = "neurotendrils.main:main"

[tool.setuptools.packages.find]
where = ["desktop", "workers/neuroflow", "workers/neurostudio"]
include = ["neurotendrils*", "neuroflow*", "neurostudio*"]
